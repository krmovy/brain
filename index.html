<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121214">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Мозг">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">

<title>Мозг Ерназара</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#121214; --card:rgba(20,20,22,.74); --tile:rgba(36,36,40,.72); --line:#222222; --chip:#262626;
  --text:#F2F2F2; --muted:#8C8C8C; --soft:#BDBDBD; --dim:#6A6A6A;
  --green:#5EE07A; --greenLine:#2F6B3A;
  --redBg:#3A1D1E; --red:#FF8A8A; --blueBg:#1D2541; --blue:#8FA8FF; --grBg:#17301D; --gr:#7CE495;
  --hot:#FFA45C; --hotBg:#3A2414; --hotLine:rgba(255,164,92,.35);
  --ease:cubic-bezier(.2,.8,.2,1);
  --hatch:repeating-linear-gradient(-45deg,#262626 0 3px,#181818 3px 8px);
}
*{box-sizing:border-box}
html{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;background:#121214;color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overflow-x:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--text)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:#121214}
#bg svg{position:absolute;inset:0;width:100%;height:100%}
#bg .bgD{display:none}
@media (min-width:900px){#bg .bgM{display:none}#bg .bgD{display:block}}
#bg .mist{animation:mist 26s ease-in-out infinite}
#bg .m2{animation-duration:34s;animation-delay:-8s}#bg .m3{animation-duration:42s;animation-delay:-15s}
@keyframes mist{0%,100%{transform:translateX(-30px)}50%{transform:translateX(30px)}}
#app{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 120px)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.title{margin:0;font-size:30px;font-weight:500;letter-spacing:-.5px}
.sub{color:var(--muted);font-size:14px}
.me{display:flex;align-items:center;gap:10px;background:#161616;border-radius:26px;padding:4px 4px 4px 16px;height:48px}
.me span{font-size:14px;font-weight:500}
.me img{width:40px;height:40px;border-radius:20px;border:2px solid var(--greenLine);display:block}
.round{width:48px;height:48px;border-radius:24px;background:#161616;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.round.light{background:var(--text);color:var(--bg)}
.card{background:var(--card);border-radius:28px;padding:18px}
.card h2{margin:0;font-size:17px;font-weight:500}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stack{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pill{font-size:12px;border-radius:12px;padding:5px 10px;background:var(--chip);color:var(--soft);white-space:nowrap}
.pill.white{background:var(--text);color:var(--bg);font-weight:500}
.big{font-size:56px;font-weight:400;letter-spacing:-2px;line-height:1}
.mid{font-size:28px;font-weight:400;letter-spacing:-.5px}
.bar{height:28px;border-radius:14px;background:var(--hatch);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:14px;background:#E8E8E8;transform-origin:left;animation:growx 1.1s var(--ease) .35s both}
.bar.thin{height:12px;border-radius:6px}.bar.thin>i{border-radius:6px}
.hl{border:1px solid var(--greenLine);border-radius:28px;padding:10px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;animation:pulse 2.8s ease-in-out 1.5s infinite}
.tile{background:var(--tile);border-radius:20px;padding:14px 16px}
.addTile{min-height:104px;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:500;transition:transform .18s ease,filter .2s}
.addTile.blue{background:var(--blueBg);color:var(--blue)}.addTile.red{background:var(--redBg);color:var(--red)}
.addTile:hover{filter:brightness(1.15)}
.span2{grid-column:span 2}
.dash{height:10px;border-radius:5px;background:repeating-linear-gradient(90deg,#2A2A2A 0 2px,transparent 2px 6px)}
.boxNum{background:#2E2E2E;border-radius:16px;padding:8px 14px;display:flex;flex-direction:column;align-items:center}
.boxNum small{font-size:11px;color:var(--soft)}.boxNum b{font-size:22px;font-weight:500}

.task{display:flex;align-items:center;gap:12px;min-height:52px;border-top:1px solid var(--line)}
.task input{width:22px;height:22px;margin:0;accent-color:var(--green);flex-shrink:0;cursor:pointer}
.task .t{flex:1;min-width:0;font-size:15px;line-height:1.35;text-align:left;padding:10px 0;transition:color .3s;overflow-wrap:anywhere}
.task.done .t{color:var(--dim);text-decoration:line-through}
.task .more{width:36px;height:36px;border-radius:18px;display:flex;align-items:center;justify-content:center;color:var(--muted);flex-shrink:0}
.task .more:hover{background:#222;color:var(--text)}
.grp{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;padding:14px 0 10px;color:var(--text)}
.grp .gdot{width:8px;height:8px;border-radius:4px;margin-top:7px;flex-shrink:0}
.gt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.gt b,.clamp2{font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gt b{font-size:15px;line-height:1.35}
.gt small,.clamp1{font-size:12px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.grp svg{flex-shrink:0;margin-top:3px}
.edit{font-size:12px;color:var(--soft);background:#222;border-radius:12px;padding:6px 12px}
.inline{display:flex;gap:8px;margin-top:10px}
.field{flex:1;min-width:0;background:#1C1C1C;border:1px solid transparent;border-radius:16px;padding:0 14px;min-height:46px;outline:none;font-size:16px;transition:border-color .2s}
.field:focus{border-color:#3A3A3A}
textarea.field{padding:12px 14px;resize:vertical;min-height:80px;line-height:1.45}
.btn{min-height:46px;padding:0 18px;border-radius:16px;background:var(--text);color:var(--bg);font-weight:600;font-size:14px;transition:transform .15s,opacity .2s}
.btn.ghost{background:#222;color:var(--text)}
.btn.danger{background:var(--redBg);color:var(--red)}
.btn:disabled{opacity:.4}
.empty{color:var(--muted);font-size:14px;line-height:1.5;padding:12px 0}

.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;background:#161616;border-radius:26px;padding:4px}
.seg button{min-height:44px;border-radius:22px;font-size:14px;font-weight:500;color:var(--soft);transition:background-color .25s,color .25s}
.seg button.on{background:var(--text);color:var(--bg)}
.search{display:flex;align-items:center;gap:10px;background:#161616;border-radius:26px;padding:0 18px;min-height:50px}
.search input{flex:1;background:none;border:0;outline:none;font-size:16px;min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;font-size:13px;padding:9px 14px;border-radius:20px;background:#222;color:var(--soft);transition:transform .15s,background-color .2s,color .2s,box-shadow .2s}
.chip.on{box-shadow:0 0 0 2px var(--text) inset}
.chip.all.on{background:var(--text);color:var(--bg);box-shadow:none}
.idea{background:var(--card);border-radius:24px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;text-align:left;width:100%;transition:transform .18s ease,background-color .2s}
.idea:hover{background:#191919}
.idea h3{margin:0;font-size:16px;font-weight:500;line-height:1.35}
.idea .meta{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.tag{font-size:12px;padding:5px 10px;border-radius:12px}
.st{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--soft);background:#222;border-radius:12px;padding:5px 10px}
.st i{width:7px;height:7px;border-radius:4px}
.hook p{margin:0;font-size:17px;line-height:1.35}

.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 0;border-radius:22px;background:#161616}
.day small{font-size:11px;opacity:.75}.day b{font-size:17px;font-weight:500}
.day i{width:6px;height:6px;border-radius:3px;background:transparent}
.day.today{background:var(--text);color:var(--bg)}
.prow{display:flex;align-items:flex-start;gap:14px;background:var(--card);border:1px solid var(--card);border-radius:22px;padding:12px 16px;min-height:60px}
.prow.today{border-color:var(--greenLine)}
.prow.emptyday{background:none;border:1px dashed #2A2A2A}
.prow .d{width:40px;display:flex;flex-direction:column;flex-shrink:0}
.prow .d small{font-size:11px;color:var(--muted)}.prow .d b{font-size:18px;font-weight:500}
.prow .items{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
.pitem{display:flex;flex-direction:column;gap:3px;text-align:left;width:100%}
.pitem span{font-size:14px;font-weight:500}.pitem small{font-size:12px;color:var(--muted)}
.addday{font-size:13px;color:var(--muted);text-align:left;min-height:32px}
.mixrow{display:flex;flex-direction:column;gap:6px}
.mixrow .row span{font-size:13px;color:var(--soft)}
.mixrow .bar>i{transform-origin:left}

.ring{border-radius:50%;display:flex;flex-direction:column;align-items:center;padding-top:12px}
.ring span{font-size:11px}

/* nav */
#nav{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 18px);transform:translateX(-50%);width:min(410px,calc(100% - 24px));height:68px;border-radius:34px;background:rgba(22,22,22,.82);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:0 12px 32px rgba(0,0,0,.6);border:1px solid #2A2A2A;display:flex;justify-content:space-between;align-items:center;padding:0 8px;z-index:20;animation:navin .6s var(--ease) .2s both}
#nav a{position:relative;height:52px;width:50px;border-radius:26px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-size:14px;font-weight:500;overflow:hidden;flex-shrink:0;transition:width .45s var(--ease),background-color .3s,color .3s}
#nav a span{white-space:nowrap;max-width:0;opacity:0;transition:max-width .45s var(--ease),opacity .3s .1s}
#nav a svg{flex-shrink:0;transition:transform .2s}
#nav a:hover{color:var(--text)}
#nav a:hover svg{transform:translateY(-2px)}
#nav a.on{width:120px;background:var(--text);color:var(--bg)}
#nav a.on span{max-width:90px;opacity:1}
#nav a.on svg{animation:iconpop .6s var(--ease)}
@media (max-width:420px){#nav{padding:0 6px}#nav a{width:44px;height:48px}#nav a.on{width:112px}}
#nav a.dot::after{content:'';position:absolute;top:10px;right:10px;width:8px;height:8px;border-radius:4px;background:var(--green);box-shadow:0 0 0 2px rgba(22,22,22,.9)}
.agFind{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px solid #222}
.agFind:first-of-type{border-top:0}
@media (min-width:900px){
  #nav{top:20px;bottom:auto;width:auto;gap:8px;padding:0 8px}
  #nav a{width:auto;padding:0 18px}
  #nav a span{max-width:90px;opacity:1}
  #nav a.on{width:auto}
  #app{padding-top:110px;padding-bottom:60px}
  .cols{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px;align-items:start}
}
.cols>div{display:flex;flex-direction:column;gap:14px}
@media (max-width:899px){.cols{display:flex;flex-direction:column;gap:14px}}

/* view transitions */
.view{display:flex;flex-direction:column;gap:14px}
.view.inR{animation:inR .45s var(--ease) both}
.view.inL{animation:inL .45s var(--ease) both}
.rise{animation:up .55s var(--ease) var(--d,0s) both}
@keyframes inR{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes navin{from{opacity:0;transform:translate(-50%,40px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes iconpop{0%{transform:scale(.5) rotate(-25deg)}60%{transform:scale(1.15) rotate(6deg)}100%{transform:none}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(94,224,122,.35)}50%{box-shadow:0 0 0 8px rgba(94,224,122,0)}}
@keyframes pop{0%{opacity:0;transform:translateY(90px) scale(.8)}55%{opacity:1;transform:translateY(-12px) scale(1.03)}75%{transform:translateY(4px) scale(.99)}100%{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-8px) rotate(-1.5deg)}}
@keyframes shadow{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.85);opacity:.55}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}

/* sheet */
#sheetWrap{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
#sheetWrap[hidden]{display:none}
#sheetWrap .back{position:absolute;inset:0;background:rgba(0,0,0,.6);animation:fade .25s ease both}
#sheet{position:relative;width:min(560px,100%);max-height:88vh;overflow-y:auto;background:#121212;border-radius:28px 28px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom) + 24px);animation:sheetUp .4s var(--ease) both;display:flex;flex-direction:column;gap:14px}
@media (min-width:900px){#sheetWrap{align-items:center}#sheet{border-radius:28px}}
#sheet>*{flex-shrink:0}
.grab{width:40px;height:5px;border-radius:3px;background:#333;margin:4px auto 2px}
.lbl{font-size:12px;color:var(--muted);margin-bottom:-6px}

/* splash */
#splash{position:fixed;inset:0;z-index:60;background:radial-gradient(circle at 50% 38%,#1F1F1F 0%,#0A0A0A 62%);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s ease,transform .5s ease}
#splash.out{opacity:0;transform:scale(1.04);pointer-events:none}
#splash .who{animation:pop 1.05s var(--ease) .1s both}
#splash img{height:min(380px,46vh);display:block;transform-origin:50% 100%;animation:float 3.2s ease-in-out 1.3s infinite}
#splash .sh{width:200px;height:18px;margin-top:-10px;border-radius:50%;background:radial-gradient(ellipse at center,rgba(0,0,0,.7) 0%,rgba(0,0,0,0) 70%);animation:fade .6s ease .5s both,shadow 3.2s ease-in-out 1.3s infinite}
#splash .nick{margin-top:28px;font-size:40px;font-weight:500;letter-spacing:-1px;animation:up .6s var(--ease) .75s both}
#splash .tag2{margin-top:8px;font-size:15px;color:var(--muted);animation:up .6s var(--ease) .9s both}

.flame{width:52px;height:52px;border-radius:18px;background:#2A1A10;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.flame svg{animation:flick 1.6s ease-in-out infinite;transform-origin:50% 90%}
.flame.off{background:#1E1E1E}.flame.off svg{animation:none;opacity:.45}
@keyframes flick{0%,100%{transform:scale(1) rotate(0)}30%{transform:scale(1.06,.97) rotate(-3deg)}60%{transform:scale(.97,1.05) rotate(2deg)}}
.dots7{display:flex;gap:6px}.dots7 i{width:22px;height:6px;border-radius:3px;background:#262626}.dots7 i.on{background:#FFA45C}.dots7 i.today{outline:1px solid #555;outline-offset:2px}
.ai{background:#171717;border:1px solid #262626;border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px}
.ai .out{font-size:14px;line-height:1.55;white-space:pre-wrap;color:var(--text)}
.ai .hk{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.ai .hk:first-child{border-top:0}
.ai .hk p{margin:0;flex:1;font-size:15px;line-height:1.4}
.ai .hk small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.spark{display:inline-flex;align-items:center;gap:8px}
.thinking{color:var(--muted);font-size:14px;display:flex;align-items:center;gap:8px}
.thinking i{width:8px;height:8px;border-radius:4px;background:var(--muted);animation:blink 1s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:12px}
.status{display:flex;align-items:center;gap:14px}
.status .dot{width:12px;height:12px;border-radius:6px;background:#555;flex-shrink:0}
.status.on .dot{background:var(--green);animation:pulse2 1.6s ease-in-out infinite}
@keyframes pulse2{0%,100%{box-shadow:0 0 0 0 rgba(94,224,122,.6)}50%{box-shadow:0 0 0 7px rgba(94,224,122,0)}}
.timer{font-size:40px;font-weight:400;letter-spacing:-1px;font-variant-numeric:tabular-nums;line-height:1}
.statusCard.on{border:1px solid var(--greenLine);background:linear-gradient(180deg,rgba(94,224,122,.06),rgba(94,224,122,0)) ,var(--card)}
.me{position:relative;cursor:pointer;transition:transform .15s,background-color .2s}
.me:hover{background:#1C1C1C}
.me .sd{position:absolute;right:2px;bottom:2px;width:12px;height:12px;border-radius:6px;border:2px solid #161616;background:#555}
.me .sd.on{background:var(--green)}
#workChip{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translateX(-50%);z-index:19;display:flex;align-items:center;gap:10px;background:rgba(23,40,28,.9);border:1px solid var(--greenLine);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:22px;padding:8px 8px 8px 14px;font-size:14px;font-variant-numeric:tabular-nums;animation:up .4s var(--ease) both}
#workChip[hidden]{display:none}
#workChip button{background:var(--text);color:var(--bg);border-radius:14px;padding:6px 12px;font-size:13px;font-weight:600}
@media (min-width:900px){#workChip{bottom:24px}}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{background:#1A1A1A;border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.badge .ic{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:#262626;color:#6A6A6A}
.badge.got .ic{background:var(--grBg);color:var(--gr)}
.badge b{font-size:14px;font-weight:500}.badge small{font-size:12px;color:var(--muted);line-height:1.35}
.badge:not(.got) b{color:var(--soft)}
.badge .pr{height:6px;border-radius:3px;background:#262626;overflow:hidden}.badge .pr i{display:block;height:100%;background:var(--soft);border-radius:3px}
.badge.new{animation:glow 1.4s ease-in-out 3}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(94,224,122,0)}50%{box-shadow:0 0 0 3px rgba(94,224,122,.5)}}
.wbars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;align-items:end;height:120px}
.wbars div{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.wbars .b{width:100%;flex:1;border-radius:10px;background:var(--hatch);display:flex;align-items:flex-end;overflow:hidden}
.wbars .b i{display:block;width:100%;border-radius:10px;background:#3A3A3A;transform-origin:bottom;animation:growy .8s var(--ease) both}
.wbars .b i.t{background:#E8E8E8}
.wbars small{font-size:11px;color:var(--muted)}
@keyframes growy{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.quote{position:relative;overflow:hidden}
.quote .qm{position:absolute;right:16px;bottom:-62px;font-size:120px;line-height:1;color:#1F1F1F;font-family:Georgia,serif;pointer-events:none}
.quote blockquote{margin:0;font-size:19px;line-height:1.45;font-weight:300;position:relative}
.quote .who{font-size:13px;color:var(--soft)}
.quote .why{font-size:13px;line-height:1.5;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.quote .swap{animation:up .45s var(--ease) both}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 100px);transform:translate(-50%,20px);background:#222;color:var(--text);padding:12px 18px;border-radius:16px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:70;max-width:calc(100% - 40px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#note{background:#1E1712;color:#F2C38A;border-radius:18px;padding:12px 16px;font-size:13px;line-height:1.45;margin-bottom:14px}
#note[hidden]{display:none}

button:active,a:active,.task:active{transform:scale(.97)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.card,.idea,.day,.prow:not(.emptyday),.me,.round:not(.light),.search,.seg{-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.day,.me,.round:not(.light),.search,.seg{background:rgba(22,22,24,.72)}
.idea{background:var(--card)}
.day.today{background:var(--text)}
.idea:hover{background:rgba(28,28,30,.82)}
.field{background:rgba(30,30,33,.8)}
.badge,.ai{background:rgba(26,26,28,.8)}
@media (max-width:420px){.me>span{display:none}.me{padding:4px}}
@media (max-width:899px){
  #nav{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:2px;width:min(440px,calc(100% - 24px));padding:0 6px;background:rgba(16,16,18,.94)}
  #nav a,#nav a.on{width:auto;height:56px;padding:0;flex-direction:column;justify-content:center;gap:4px;border-radius:20px;font-size:10px}
  #nav a span,#nav a.on span{max-width:none;opacity:1;font-size:10px;font-weight:500;letter-spacing:-.1px;transition:none}
  #nav a svg{width:21px;height:21px}
  #nav a.dot::after{top:6px;right:calc(50% - 18px)}
}

.me b.pill{font-size:12px}
.me{padding:4px 4px 4px 14px;border:0;color:var(--text)}
.t small{display:block}
select.field{appearance:none;-webkit-appearance:none;padding-right:10px}
.chip.on.all{background:var(--text);color:var(--bg);box-shadow:none}
label.task{cursor:pointer}
p{margin:6px 0}
#splash .logo{font-size:84px;animation:pop 1.05s var(--ease) .1s both}

/* Залёты */
.xb{display:inline-block;font-size:12px;font-weight:600;border-radius:10px;padding:3px 8px;background:#262626;color:var(--soft);margin-top:4px}
.xb.on{background:var(--hotBg);color:var(--hot)}
.hitc{background:var(--card);border-radius:24px;padding:16px 18px;border:1px solid var(--hotLine);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.hk1{margin-top:8px;font-size:15px;line-height:1.4;background:rgba(255,164,92,.08);border-left:3px solid var(--hot);border-radius:10px;padding:8px 10px}
.hotNum{color:var(--hot)}
.motiv{margin:12px 0 0;font-size:14px;line-height:1.5;color:var(--soft)}
.bar>i.hot{background:var(--hot)}
/* ===== ТЕМА: графит как у друга + мягкий розовый (сакура) + японский минимализм ===== */
:root{
  --green:#F4A7B9; --greenLine:rgba(244,167,185,.4);
  --redBg:#3A1E26; --red:#F7B3C2; --grBg:#2E1D23; --gr:#F4A7B9;
  --hot:#F4A7B9; --hotBg:#33202A; --hotLine:rgba(244,167,185,.35);
}
.pill.white,.me b.pill{background:#F4A7B9;color:#1A1114}
.bar>i{background:linear-gradient(90deg,#C97A8E,#F4A7B9)}

};

const HYP_ST=['Идея','Тест','Масштабировать','Закрыта'];

/* ===== Утилиты ===== */
const $=s=>document.querySelector(s);
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=u=>/^https:\/\//.test(String(u||''))?String(u):'';
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const ru=d=>pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear();
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)};
const fromRu=s=>{const m=String(s||'').match(/(\d{1,2})\.(\d{1,2})\.(\d{4})/);return m?m[3]+'-'+pad(m[2])+'-'+pad(m[1]):''};
const toRu=s=>s?s.slice(8,10)+'.'+s.slice(5,7)+'.'+s.slice(0,4):'';
const short=s=>s?s.slice(8,10)+'.'+s.slice(5,7):'';
const pid=u=>{const m=String(u||'').match(/([0-9a-f]{32})/i);return m?m[1]:u};
const yes=v=>v==='__YES__'||v===true;
const MON=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const WD=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
const hm=dt=>{const d=new Date(dt);return pad(d.getHours())+':'+pad(d.getMinutes())};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2600)}
const LS={get(k,d){try{const v=localStorage.getItem('brain_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('brain_'+k,JSON.stringify(v))}catch(e){}}};

/* ===== Состояние ===== */
const S={view:'today',mode:new Date().getHours()>=17?'eve':'morn',work:'focus',mcp:null,sample:null,err:{},
  cal:null,tasks:null,dec:null,prom:null,proj:null,quests:null,habits:null,ideas:null,finds:null,metrics:null,hyp:null,clients:null,shop:null,ach:null,reels:null,

// Мои ролики: медиана, ×к медиане, залёт = ×2 и выше. Всё считается здесь, в базе только сырые цифры.
const HIT_X=2;
function reelStats(){
  const all=(S.reels||[]).filter(r=>+r.v>0).map(r=>({...r,v:+r.v})).sort((a,b)=>(a.d||'')<(b.d||'')?1:-1);
  const from=addDays(today(),-90),recent=all.filter(r=>r.d&&r.d>=from),base=(recent.length>=5?recent:all).map(r=>r.v).sort((a,b)=>a-b);
  const med=base.length?(base.length%2?base[(base.length-1)/2]:(base[base.length/2-1]+base[base.length/2])/2):0;
  all.forEach(r=>{r.x=med?r.v/med:0;r.hit=r.x>=HIT_X});
  const hits=all.filter(r=>r.hit).sort((a,b)=>b.x-a.x);
  const best=all.slice().sort((a,b)=>b.v-a.v)[0]||null;
  const last30=all.filter(r=>r.d&&r.d>=addDays(today(),-30));
  return {all,med,hits,best,last30,hits30:last30.filter(r=>r.hit).length,views30:last30.reduce((a,r)=>a+r.v,0),rate:hits.length?Math.round(all.length/hits.length):0};
}
const fmtN=n=>{n=+n||0;return n>=1e6?(n/1e6).toFixed(1).replace('.0','')+'M':n>=1e4?Math.round(n/1e3)+'K':n>=1e3?(n/1e3).toFixed(1).replace('.0','')+'K':String(Math.round(n))};

/* ===== Подключение ===== */
function vConnect(){return `<div class="top rise"><div><h1 class="title">🧠 Мозг</h1><div class="sub">Подключи свой сервер</div></div></div>${card('Подключи таблицу',`<p class="sub" style="margin:0 0 10px">Вставь ссылку <b>/exec</b> из Apps Script и ключ приложения из журнала (функция <b>setup</b>).</p><div class="stack"><input class="field" id="cUrl" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off"><input class="field" id="cKey" placeholder="Ключ приложения" autocomplete="off"><button class="btn" data-act="connect">Подключить</button></div>`)}`}
async function connect(){
  const url=$('#cUrl').value.trim(),key=$('#cKey').value.trim();
  if(!/^https:\/\/script\.google(usercontent)?\.com\/.+\/exec$/.test(url))return toast('Ссылка должна заканчиваться на /exec');
  if(!key)return toast('Вставь ключ');
  try{const h=await (await fetch(url)).json();if(!h.ok)throw new Error('server');S.conn={url,key};await api([{action:'ping'}]);
    LS.set('conn',S.conn);S.sample=h.ai?SAMPLE:null;toast('Подключено ✓');render();loadAll()}
  catch(e){S.conn=null;toast(String(e.message).includes('bad_key')?'Неверный ключ':'Не удалось подключиться: проверь ссылку и доступ «Все»')}
}
const SAMPLE=Object.assign(async p=>one({action:'ai',prompt:p}),{json:async p=>{const r=await one({action:'ai',prompt:p,json:true});try{return JSON.parse(r.text)}catch(e){const m=r.text.match(/\[[\s\S]*\]|\{[\s\S]*\}/);return m?JSON.parse(m[0]):null}}});

const VIEWS={today:vToday,work:vWork,blog:vBlog,hits:vHits,biz:vBiz,me:vMe};
function render(){
  const f=document.activeElement&&document.activeElement.id,val=f&&document.activeElement.value;
  const keep={};document.querySelectorAll('#view input.field,#view textarea.field').forEach(e=>{if(e.id)keep[e.id]=e.value});
  $('#view').innerHTML=S.conn?VIEWS[S.view]():vConnect();
  $('#nav').style.display=S.conn?'':'none';
  Object.keys(keep).forEach(id=>{const e=document.getElementById(id);if(e&&keep[id])e.value=keep[id]});
  if(f){const e=document.getElementById(f);if(e){e.focus();try{e.setSelectionRange(val.length,val.length)}catch(x){}}}
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.v===S.view));
  const nf=(S.finds||[]).filter(x=>x.dec==='Новая'||!x.dec).length;$('#nav a[data-v=hits]').classList.toggle('dot',nf>0);

function tick(){const w=LS.get('timer',null);const s=w?Math.floor((Date.now()-w.start)/1000):0;const t=pad(Math.floor(s/3600))+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60);document.querySelectorAll('[data-timer]').forEach(e=>e.textContent=t);$('#workChip').hidden=!w}

function ctxWork(){const mine=(S.tasks||[]).filter(x=>myTask(x)&&open(x));return mine.map(t=>`${t.id} [${t.st}${t.dl?', DL '+toRu(t.dl):''}] ${t.title}${t.next?' — след. шаг: '+t.next:''}${t.block?' — блокер: '+t.block:''}`).join('\n')}
const ME_CTX='Я Ерназар, Product Service Manager (PSM) Krisha в Kolesa Group (Алматы). Пиши по-русски, коротко и по делу, без markdown-разметки.';
async function ai(key,prompt){
  if(!S.sample)return;S.ai[key]={loading:true,text:''};render();
  try{const r=await S.sample(prompt);S.ai[key].text=r.text;S.ai[key].loading=false}
  catch(e){S.ai[key].loading=false;S.ai[key].err=e&&e.code==='rate_limited'?'Слишком часто — подожди минуту':errMsg(e)}
  render();
}
let thT=0;function throttle(){const n=Date.now();if(n-thT>150){thT=n;render()}}
function prepPrompt(e){const who=(e.attendees||[]).filter(a=>!a.self&&!a.resource).map(a=>a.displayName||a.email).join(', ');const first=(e.attendees||[]).map(a=>(a.displayName||a.email.split('@')[0]).split(' ')[0].toLowerCase());

  return `${ME_CTX}\nПодготовь меня к встрече за 1 минуту чтения.\nВстреча: ${e.summary} в ${hm(e.start.dateTime)}. Участники: ${who||'—'}.\nОписание: ${(e.description||'').slice(0,800)}\nМои открытые задачи:\n${ctxWork()}\nОбещания с участниками:\n${pr||'нет'}\nОткрытые action items:\n${dec||'нет'}\n\nФормат: 1) Зачем я там (1 строка). 2) Что я обещал и должен показать. 3) 2–3 вопроса, которые стоит задать. 4) Что зафиксировать в итоге.`}

/* ===== Действия ===== */
async function act(name,el){
  const d=el.dataset,t=today();
  const guard=async(fn,ok)=>{try{await fn();if(ok)toast(ok)}catch(e){toast(errMsg(e));if(/row_not_found|row_ambiguous|bad_match/.test(String(e&&e.message)))loadAll()}};
  switch(name){
  case 'go':S.view=d.v;location.hash=d.v;render();window.scrollTo(0,0);break;
  case 'refresh':toast('Обновляю…');loadAll();break;
  case 'settings':openSheet({type:'settings'});break;
  case 'connect':connect();break;
  case 'disconnect':LS.set('conn',null);S.conn=null;closeSheet();render();break;
  case 'mode':S.mode=d.m;render();break;
  case 'work':S.work=d.w;render();break;
  case 'close':closeSheet();break;
  case 'taskOpen':openSheet({type:'task',row:+d.row});break;
  case 'projOpen':openSheet({type:'proj',id:d.id});break;
  case 'hypOpen':openSheet({type:'hyp',url:d.url});break;
  case 'taskDone':{const tk=(S.tasks||[]).find(x=>x.row===+d.row);if(!tk||!open(tk))return;tk.st='Готово';tk.updated=ru(new Date());render();
    await guard(()=>setRow(C.SVC,'Задачи',{A:tk.id},tk.row,{H:'Готово',Q:ru(new Date())}),`${tk.id} закрыта ✓`);break}
  case 'taskMove':{const tk=(S.tasks||[]).find(x=>x.row===+d.row);const nd=$('#mvDate').value,why=$('#mvWhy').value.trim();if(!nd||!why)return toast('Укажи дату и причину');
    const note=`${short(t)}: DL ${toRu(tk.dl)||'—'} → ${toRu(nd)}. ${why}`;const upd=note+(tk.upd?'\n'+tk.upd:'');
    await guard(async()=>{await setRow(C.SVC,'Задачи',{A:tk.id},tk.row,{J:toRu(nd),K:tk.moves+1,M:upd,Q:ru(new Date())});tk.dl=nd;tk.moves++;tk.upd=upd},'DL перенесён');render();break}
  case 'promDone':{const p=(S.prom||[]).find(x=>x.row===+d.row);p.st='Сделано';render();await guard(()=>setRow(C.JB,'Обещания',p.id?{A:p.id}:{B:p.date,E:p.what},p.row,{I:'Сделано'}),'Обещание закрыто ✓');break}
  case 'decDone':{const x=(S.dec||[]).find(y=>y.row===+d.row);x.st='Сделано';render();await guard(()=>setRow(C.SVC,'Решения',{A:x.date,C:x.dec,D:x.act},x.row,{G:'Сделано'}),'Готово ✓');break}
  case 'pDir':S.pDir=d.d;render();break;
  case 'promAdd':{const who=$('#pWho').value.trim(),what=$('#pWhat').value.trim();if(!what)return toast('Что обещано?');const id='P'+Date.now().toString(36).slice(-5).toUpperCase();
    const row=[id,ru(new Date()),S.pDir||'Я обещал',who,what,$('#pDue').value?toRu($('#pDue').value):'',$('#pProj').value.trim(),'','Открыт',''];
    await guard(async()=>{await appendRow(C.JB,'Обещания!A1',row);(S.prom=S.prom||[]).push({row:(S.prom.length+2),id,dir:row[2],who,what,due:$('#pDue').value,st:'Открыт'});['pWho','pWhat','pDue','pProj'].forEach(k=>$('#'+k).value='')},'Записал');render();break}
  case 'projMode':{const p=(S.proj||[]).find(x=>x.id===d.id);if(d.m==='Веду'&&p.mode!=='Веду'&&(S.proj||[]).filter(x=>x.mode==='Веду').length>=4)return toast('Уже 4 проекта «Веду» — сначала освободи слот');
    p.mode=d.m;render();await guard(()=>setRow(C.JB,'Проекты',{A:p.id},p.row,{H:d.m}),'Режим: '+d.m);break}
  case 'projCopy':{const p=(S.proj||[]).find(x=>x.id===d.id);const ts=(S.tasks||[]).filter(x=>p.tids.includes(x.id));const txt=`${p.name}\n`+ts.map(x=>`• ${x.id} ${x.title} — ${x.st}${x.dl?', DL '+toRu(x.dl):''}${x.next?'. Дальше: '+x.next:''}`).join('\n');copy(txt);break}
  case 'questDone':{const q=(S.quests||[]).find(x=>x.url===d.url);q.st='Готово';q.due=q.due||t;render();await guard(()=>nUpdate('quests',q.url,{'Статус':'Готово','Сегодня':'__NO__'}),`+${XP[q.k]||0} XP 🎉`);break}
  case 'questToday':{const q=(S.quests||[]).find(x=>x.url===d.url);q.td=d.on==='1'?'__NO__':'__YES__';render();await guard(()=>nUpdate('quests',q.url,{'Сегодня':q.td}));break}
  case 'qAdd':{const tt=$('#qT').value.trim();if(!tt)return;await guard(async()=>{await nCreate(C.N.quests,{'Квест':tt,'Тип':$('#qK').value,'Сфера':$('#qS').value,'Статус':'В плане','Герой':[C.HERO]});$('#qT').value='';loadAll()},'Квест добавлен');break}
  case 'habit':{const k=d.k,on=el.checked;let r=(S.habits||[]).find(x=>x.d===t);
    await guard(async()=>{const prop=k==='h1'?'Час на блог или бизнес':'Вечерний итог и план';
      if(r&&r.url){await nUpdate('habits',r.url,{[prop]:on?'__YES__':'__NO__'});r[k]=on?'__YES__':'__NO__'}
      else{const p=await nCreate(C.N.habits,{'День':t,'date:Дата:start':t,[prop]:on?'__YES__':'__NO__','Герой':[C.HERO]});r={url:p&&p.id,d:t,[k]:on?'__YES__':'__NO__'};(S.habits=S.habits||[]).unshift(r)}},on?'+5 XP':'');render();break}
  case 'jMin':S.jMin=+d.m;render();break;
  case 'jType':S.jType=d.m;render();break;
  case 'jAdd':{const w=$('#jWhat').value.trim();if(!w||!S.jMin)return toast('Выбери минуты и опиши');await guard(async()=>{await appendRow(C.JB,'Журнал!A1',['L'+Date.now().toString(36).slice(-5).toUpperCase(),ru(new Date()),'',S.jMin,S.jType||'',w,'','Мозг','']);$('#jWhat').value='';S.jMin=null},'В журнале');render();break}
  case 'tmrSave':{const tm=[0,1,2].map(i=>[$('#tm'+i).value.trim(),$('#tms'+i).value]).filter(x=>x[0]);if(!tm.length)return;const tmr=addDays(t,1);
    await guard(async()=>{for(const x of tm)await nCreate(C.N.quests,{'Квест':x[0],'Сфера':x[1],'Тип':'Задача','Статус':'В плане','date:Срок:start':tmr,'Сегодня':'__YES__','Герой':[C.HERO]});[0,1,2].forEach(i=>$('#tm'+i).value='');loadAll()},'Завтра запланировано 🌙');break}
  case 'agrParse':{const txt=$('#agrText').value.trim();if(!txt||!S.sample)return;S.agr={loading:true};render();
    try{const r=await S.sample.json(`${ME_CTX}\nСегодня ${toRu(t)}. Разбери текст на договорённости. Ответь только JSON-массивом объектов {"dir":"Я обещал" или "Мне обещали","who":"имя человека","what":"что именно, коротко","due":"дата в формате ДД.ММ.ГГГГ или пустая строка"}.\nТекст:\n${txt}`,{cache:false});
      S.agr={items:(Array.isArray(r)?r:[]).map(x=>({dir:/мне/i.test(x.dir)?'Мне обещали':'Я обещал',who:String(x.who||''),what:String(x.what||''),due:String(x.due||''),on:true}))}}catch(e){S.agr={err:'ИИ не смог разобрать'}}render();break}
  case 'agrToggle':S.agr.items[+d.i].on=el.checked;break;
  case 'agrSave':{const items=S.agr.items.filter(x=>x.on);await guard(async()=>{for(const p of items){await appendRow(C.JB,'Обещания!A1',['P'+Math.random().toString(36).slice(2,7).toUpperCase(),ru(new Date()),p.dir,p.who,p.what,p.due,'','','Открыт',''])}S.agr=null;$('#agrText').value='';loadAll()},`Сохранено: ${items.length}`);render();break}
  case 'prep':{const e=(S.cal||[])[+d.i];if(e)ai('prep'+d.i,prepPrompt(e));break}
  case 'status':ai('status',`${ME_CTX}\nСобери статус для руководителя по моим задачам (сервис Krisha). Формат: Сделано / В работе / Риски и блокеры / Нужна помощь. Коротко, по пунктам «•», с ID задач.\nЗадачи:\n${ctxWork()}\nЗакрытые недавно:\n${(S.tasks||[]).filter(x=>myTask(x)&&x.st==='Готово').slice(-8).map(x=>x.id+' '+x.title).join('\n')}`);break;
  case 'tz':{const v=$('#tzText').value.trim();if(v)ai('tz',`${ME_CTX}\nНапиши ТЗ по шаблону: Проблема (с цифрами, если есть) → Цель и метрика → Пользовательские сценарии → Что нужно сделать → Критерии приёмки → Риски. Входные данные:\n${v}`);break}
  case 'summary':{const v=$('#sumText').value.trim();if(v)ai('summary',`${ME_CTX}\nСделай резюме встречи: 1) Решения. 2) Задачи: кто — что — срок. 3) Риски. 4) Короткий пост для Telegram (3–5 строк). Текст встречи:\n${v.slice(0,20000)}`);break}
  case 'copyAi':copy(S.ai[d.k].text);break;
  case 'copyTxt':{const i=(S.ideas||[]).find(x=>x.url===d.url);if(i)copy(i.notes||'');break}
  case 'hooks':{const i=(S.ideas||[]).find(x=>x.url===d.url);ai('hooks'+d.url,`Я веду блог @krmovy (Instagram Reels): ИИ, деньги и цифры, истории о себе, путь PSM в Kolesa. Цель — 10 000 подписчиков. Придумай 5 хуков (первая фраза до 12 слов, чтобы не пролистали за 2 секунды) для идеи: «${i.t}». ${i.hook?'Текущий хук: '+i.hook:''} Разные приёмы: интрига, цифры, боль, вызов. Только список из 5 строк.`);break}
  case 'ideaAdd':{const tt=$('#ideaT').value.trim();if(!tt)return;await guard(async()=>{await nCreate(C.N.ideas,{'Название':tt,'Вид':$('#ideaK').value,'Статус':'Сырая','Источник':'Свой'});$('#ideaT').value='';loadAll()},'В банке');break}
  case 'ideaNext':{const i=(S.ideas||[]).find(x=>x.url===d.url);const nx=IDEA_ST[Math.min(3,IDEA_ST.indexOf(i.st||'Сырая')+1)];i.st=nx;render();const pr={'Статус':nx};if(nx==='Выложено')pr['date:Дата публикации:start']=t;await guard(()=>nUpdate('ideas',i.url,pr),'→ '+nx);break}
  case 'copyHook':copy(d.h||'');break;
  case 'reelAgain':{const r=reelStats().all.find(x=>x.url===d.url);if(!r)return;const pr={'Название':'Ещё раз: '+(r.t||'залёт'),'Вид':'Идея','Статус':'Сырая','Источник':'Свой','Хук':r.hook||'','Заметки':`Повтор моего залёта ×${r.x.toFixed(1)} (${fmtN(r.v)} просм.). ${r.why||''}`.trim()};if(safeUrl(r.link))pr['Референс']=r.link;
    await guard(async()=>{await nCreate(C.N.ideas,pr);loadAll()},'В банке идей — снимай 🔥');break}
  case 'reelAdd':{const link=$('#rlLink').value.trim(),v=+$('#rlV').value,hk=$('#rlHook').value.trim();if(!v)return toast('Сколько просмотров?');if(link&&!safeUrl(link))return toast('Ссылка должна начинаться с https://');
    const pr={'Ролик':(hk||'Рилс '+short(t)).slice(0,80),'Просмотры':v,'Хук':hk,'Платформа':'Instagram','date:Дата:start':t,'date:Обновлено:start':t};if(link)pr['Ссылка']=link;
    await guard(async()=>{await nCreate(C.N.reels,pr);['rlLink','rlV','rlHook'].forEach(k=>$('#'+k).value='');loadAll()},'Ролик добавлен');break}
  case 'hooksLike':{const top=hookBank(reelStats()).slice(0,8).map(x=>'• '+x.h).join('\n');ai('hooksLike',`${ME_CTX}\nВот хуки, которые уже сработали у меня и у похожих блогеров:\n${top}\n\nПридумай 5 новых хуков в том же стиле для моих тем (ИИ для работы, деньги и цифры, истории о себе, путь продакта в IT). Первая фраза до 12 слов, чтобы не пролистали за 2 секунды. Только список из 5 строк.`);break}
  case 'findBank':{const f=(S.finds||[]).find(x=>x.url===d.url);f.dec='В банк';render();await guard(async()=>{await nUpdate('finds',f.url,{'Решение':'В банк'});const pr={'Название':f.t,'Вид':'Идея','Статус':'Сырая','Источник':'Ресерчер','Хук':f.hook||'','Заметки':f.adapt||''};if(f.topic)pr['Тема']=f.topic;if(safeUrl(f.link))pr['Референс']=f.link;await nCreate(C.N.ideas,pr);loadAll()},'В банке идей 💡');break}
  case 'findDrop':{const f=(S.finds||[]).find(x=>x.url===d.url);f.dec='Убрано';render();await guard(()=>nUpdate('finds',f.url,{'Решение':'Убрано'}));break}
  case 'folAdd':{const n=+$('#folN').value;if(!n)return;await guard(async()=>{await nCreate(C.N.metrics,{'День':t,'date:Дата:start':t,'Подписчики':n,'Источник':'Вручную'});(S.metrics=S.metrics||[]).unshift({d:t,n,src:'Вручную'});$('#folN').value=''},'Записал');render();break}
  case 'hypAdd':{const tt=$('#hypT').value.trim();if(!tt)return;await guard(async()=>{await nCreate(C.N.hyp,{'Гипотеза':tt,'Статус':'Идея','date:Старт:start':t});$('#hypT').value='';loadAll()},'Гипотеза добавлена');break}
  case 'hypSt':{const x=(S.hyp||[]).find(y=>y.url===S.sheet.url);x.st=d.m;renderSheet();render();await guard(()=>nUpdate('hyp',x.url,{'Статус':d.m}));break}
  case 'hypSave':{const x=(S.hyp||[]).find(y=>y.url===S.sheet.url);const pr={'Тест':$('#hy_test').value,'Метрика успеха':$('#hy_metric').value,'Результат':$('#hy_res').value,'Вывод':$('#hy_concl').value};const inc=$('#hy_inc').value;if(inc!=='')pr['Доход ₸']=+inc;
    await guard(async()=>{await nUpdate('hyp',x.url,pr);Object.assign(x,{test:pr['Тест'],metric:pr['Метрика успеха'],res:pr['Результат'],concl:pr['Вывод'],inc:+inc||x.inc})},'Сохранено');closeSheet();render();break}
  case 'clAdd':{const tt=$('#clT').value.trim();if(!tt)return;const hy=(S.hyp||[]).find(x=>x.st==='Тест');const pr={'Компания':tt,'Ниша':$('#clN').value.trim(),'Стадия':'Найден','date:Дата касания:start':t};if(hy)pr['Гипотеза']=[hy.url];
    await guard(async()=>{await nCreate(C.N.clients,pr);$('#clT').value='';$('#clN').value='';loadAll()},'Клиент добавлен');break}
  case 'clNext':{const c=(S.clients||[]).find(x=>x.url===d.url);const nx=CL_ST[Math.min(5,CL_ST.indexOf(c.st||'Найден')+1)];let pr={'Стадия':nx,'date:Дата касания:start':t};
    if(nx==='Оплатил'){const s=prompt('Сумма оплаты, ₸');if(s===null)return;pr['Сумма ₸']=+s||0;c.sum=+s||0}c.st=nx;c.d=t;render();await guard(()=>nUpdate('clients',c.url,pr),'→ '+nx);break}
  case 'clLost':{const c=(S.clients||[]).find(x=>x.url===d.url);c.st='Отказ';render();await guard(()=>nUpdate('clients',c.url,{'Стадия':'Отказ'}));break}
  case 'buy':{const s=(S.shop||[]).find(x=>x.url===d.url);if(heroStats().coins<+s.price)return;s.got='__YES__';render();await guard(()=>nUpdate('shop',s.url,{'Куплено':'__YES__','date:Дата:start':t}),'Награда твоя 🎁');break}
  case 'workStart':LS.set('timer',{start:Date.now(),what:($('#tWhat')&&$('#tWhat').value)||''});render();break;
  case 'workStop':{const w=LS.get('timer',null);LS.set('timer',null);render();if(!w)return;const min=Math.round((Date.now()-w.start)/60000);toast(`Отработал ${min} мин`);
    if(min>=50){const r=(S.habits||[]).find(x=>x.d===t);if(!r||!yes(r.h1)){const cb={dataset:{k:'h1'},checked:true};act('habit',cb)}}break}
  }
}
function copy(t){try{navigator.clipboard.writeText(t).then(()=>toast('Скопировано'),()=>toast('Не удалось скопировать'))}catch(e){toast('Не удалось скопировать')}}

/* ===== События ===== */
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');if(!a)return;
  if(a.tagName==='A'&&a.dataset.v){e.preventDefault()}
  if(a.type==='checkbox'&&!['taskDone','promDone','decDone','questDone','habit','agrToggle'].includes(a.dataset.act))return;
  if(a.type==='checkbox'&&a.dataset.act!=='habit'&&a.dataset.act!=='agrToggle'&&!a.checked)return;
  act(a.dataset.act,a);
});
document.querySelectorAll('#nav a').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();S.view=a.dataset.v;history.replaceState(null,'','#'+a.dataset.v);render();window.scrollTo(0,0)}));
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.sheet)closeSheet()});

/* ===== Старт ===== */
(function init(){
  const h=(location.hash||'').slice(1);if(VIEWS[h])S.view=h;
  S.conn=LS.get('conn',null);
  const c=LS.get('cache',null);if(c&&c.data){Object.assign(S,c.data);S.syncedAt=c.at}
  render();
  setTimeout(()=>{const sp=$('#splash');if(sp){sp.classList.add('out');setTimeout(()=>sp.remove(),600)}},700);
  if(S.conn){fetch(S.conn.url).then(r=>r.json()).then(j=>{S.sample=j.ai?SAMPLE:null;render()}).catch(()=>{});loadAll()}
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.conn&&Date.now()-(S.syncedAt||0)>120000)loadAll()});
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();

</script>
</body>
</html>
