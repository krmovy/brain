/* ===== Мозг 3.0 · тема: светлая днём (пастель, как Tiimo), тёмная с 19:00 ===== */

 --w:#5B7BD5;--ws:#E3EAFE;--b:#C0569A;--bs:#FBE3F0;--z:#3E9A63;--zs:#DDF3E4;--l:#C2852F;--ls:#FCEBD3;--r:#E05D5D;--rs:#FDE6E6;--sh:0 1px 3px rgba(30,20,80,.07);--ease:cubic-bezier(.2,.8,.2,1)}

.hd{display:flex;align-items:center;gap:10px}.hd .t{flex:1;min-width:0}.hd b{font-size:21px;font-weight:700;display:block}.hd small{color:var(--mu);font-size:12px}
